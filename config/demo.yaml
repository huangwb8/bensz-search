# Synthetic provider service exercises ORIGINAL LiteLLM transformations over HTTP.
model_list: []
search_tools:
  - search_tool_name: exa
    litellm_params: {search_provider: exa_ai, api_key: demo-fixture, api_base: 'http://fixtures:8090/exa'}
  - search_tool_name: brave
    litellm_params: {search_provider: brave, api_key: demo-fixture, api_base: 'http://fixtures:8090/brave'}
  - search_tool_name: tavily
    litellm_params: {search_provider: tavily, api_key: demo-fixture, api_base: 'http://fixtures:8090/tavily'}
  - search_tool_name: serper
    litellm_params: {search_provider: serper, api_key: demo-fixture, api_base: 'http://fixtures:8090/serper'}
  - search_tool_name: perplexity
    litellm_params: {search_provider: perplexity, api_key: demo-fixture, api_base: 'http://fixtures:8090/perplexity'}
  - search_tool_name: searxng
    litellm_params: {search_provider: searxng, api_base: 'http://fixtures:8090/searxng'}
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
litellm_settings:
  turn_off_message_logging: true
router_settings:
  num_retries: 0
